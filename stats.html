<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计与筛选 - JETPHOTOS Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { 
          background-color: #ECECEC; 
          color: #333; 
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                       "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
        }
        .jet-card { background: white; border-radius: 2px; border: 1px solid #ddd; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .section-title { 
            font-size: 0.875rem; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 0.15em; border-left: 4px solid #282828; 
            padding-left: 0.75rem; color: #444; 
        }
        /* 统一的高级下拉菜单样式 */
        .custom-select {
            appearance: none;
            background-color: transparent;
            border: none;
            cursor: pointer;
            padding-right: 1.2rem;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right center;
            background-size: 0.8em;
        }
        .custom-select:focus { outline: none; }
        
        /* 针对表格的微调 */
        .rank-table th { color: #999; font-size: 10px; text-transform: uppercase; border-bottom: 1px solid #eee; padding: 8px 4px; }
        .rank-table td { font-size: 11px; padding: 8px 4px; border-bottom: 1px solid #f9f9f9; }
    </style>
</head>
<body class="pb-20">

    <nav class="bg-[#282828] text-white shadow-md relative">
        <!-- ✅ 电脑端：完全保留你原来的结构/样式 -->
        <div class="w-full h-[52px] flex justify-between items-center px-10">
            <a href="index.html" class="text-xl font-bold tracking-tighter italic hover:opacity-90 transition">
                Plane<span class="text-blue-500">Pictures</span>
            </a>
        
            <div class="flex items-center space-x-10">
                <!-- 电脑端菜单：保持原样（md及以上显示） -->
                <div class="space-x-8 text-xs uppercase tracking-widest font-bold hidden md:flex">
                    <a href="index.html" class="text-white hover:text-blue-300 transition">Home</a>
                    <a href="gallery.html" class="text-white hover:text-blue-300 transition">Photos</a>
                    <a href="stats.html" class="text-blue-400">Stats</a>
                </div>
            
                <div class="relative flex items-center">
                    <input type="text" id="nav-search-input"
                           placeholder="Search Reg..."
                           class="bg-white text-black text-[11px] px-3 py-1.5 w-32 md:w-44 rounded-sm focus:outline-none placeholder-gray-400 font-sans">
                    <button onclick="performNavSearch()" class="absolute right-2 text-gray-400 hover:text-blue-500 transition">
                        <i class="fa fa-search text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    
        <!-- ✅ 手机端：另起一行显示菜单（md以下显示） -->
        <div class="md:hidden w-full px-4 pb-3">
            <div class="flex justify-center space-x-8 text-xs uppercase tracking-widest font-bold">
                <a href="index.html" class="text-white hover:text-blue-300 transition">Home</a>
                <a href="gallery.html" class="text-white hover:text-blue-300 transition">Photos</a>
                <a href="stats.html" class="text-blue-400">Stats</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        
        <h3 class="section-title mb-8">Advanced Filter</h3>
        <section class="jet-card p-8 mb-10">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Airline</label>
                    <select id="select-airline" class="w-full bg-gray-50 border border-gray-300 text-sm p-2.5 rounded-sm focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Any Airline</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Airport</label>
                    <select id="select-airport" class="w-full bg-gray-50 border border-gray-300 text-sm p-2.5 rounded-sm focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Any Airport</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Aircraft Type</label>
                    <select id="select-model" class="w-full bg-gray-50 border border-gray-300 text-sm p-2.5 rounded-sm focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Any Type</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Registration</label>
                    <select id="select-reg" disabled class="w-full bg-gray-100 border border-gray-300 text-sm p-2.5 rounded-sm cursor-not-allowed opacity-50 transition-all">
                        <option value="">Select filters first...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-2">Featured</label>
                    <select id="select-featured" class="w-full bg-gray-50 border border-gray-300 text-sm p-2.5 rounded-sm focus:ring-blue-500 focus:border-blue-500">
                        <option value="">All Photos</option>
                        <option value="true">Featured Only</option>
                        <option value="false">Non-Featured</option>
                    </select>
                </div>
            </div>
            <div class="mt-8 flex justify-end">
                <button onclick="applyFilters()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-3 px-10 rounded-sm transition uppercase tracking-widest shadow-lg">
                    Show Results
                </button>
            </div>
        </section>

        <section class="space-y-10">
            <h3 class="section-title mb-6">Database Statistics</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="jet-card p-6">
                    <div class="text-[10px] font-bold text-gray-400 mb-4 uppercase tracking-widest">Yearly Activity</div>
                    <div id="chart-yearly" class="w-full h-[300px]"></div>
                </div>
                <div class="jet-card p-6">
                    <div class="text-[10px] font-bold text-gray-400 mb-4 uppercase tracking-widest flex items-center">
                        Monthly Distribution (
                        <select id="monthly-year-select" class="custom-select text-blue-600 font-bold ml-1">
                            </select>
                        )
                    </div>
                    <div id="chart-monthly" class="w-full h-[300px]"></div>
                </div>
            </div>

            <div class="jet-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Shooting Calendar</div>
                    <div class="flex items-center">
                        <span class="text-[10px] font-bold text-black uppercase mr-3">choose</span>
                        <select id="heatmap-year-select" class="custom-select text-blue-600 font-bold text-xs"></select>
                    </div>
                </div>
                <div id="chart-heatmap" class="w-full h-[180px]"></div>
            </div>

            <div class="jet-card p-6">
                <div class="text-[10px] font-bold text-gray-400 mb-6 uppercase tracking-widest">Airline Distribution</div>
                <div class="flex flex-col md:flex-row gap-8">
                    <div id="chart-airline" class="w-full md:w-1/2 h-[400px]"></div>
                    <div class="w-full md:w-1/2 overflow-auto">
                        <table class="w-full rank-table">
                            <thead><tr><th>Rank</th><th>Airline</th><th class="text-right">Count</th><th class="text-right">%</th></tr></thead>
                            <tbody id="table-airline"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="jet-card p-6">
                    <div class="text-[10px] font-bold text-gray-400 mb-4 uppercase tracking-widest">Aircraft Types</div>
                    <div id="chart-model" class="w-full h-[300px] mb-4"></div>
                    <table class="w-full rank-table"><tbody id="table-model"></tbody></table>
                </div>
                <div class="jet-card p-6">
                    <div class="text-[10px] font-bold text-gray-400 mb-4 uppercase tracking-widest">Airports</div>
                    <div id="chart-airport" class="w-full h-[300px] mb-4"></div>
                    <table class="w-full rank-table"><tbody id="table-airport"></tbody></table>
                </div>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="stats.js"></script>
</body>
</html>
