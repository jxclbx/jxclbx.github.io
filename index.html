<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人航空摄影集 - JETPHOTOS Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { 
          background-color: #ECECEC; 
          color: #333; 
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                       "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
        }
        .jet-card { background: white; border-radius: 0px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        #map { background: #f0f0f0; }
        .stat-value { font-family: 'Arial Black', sans-serif; color: #282828; }
        .section-title {
            font-size: 0.875rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.15em; border-left: 4px solid #282828;
            padding-left: 0.75rem; color: #444;
        }
    </style>
</head>
<body class="pb-20">

    <nav class="bg-[#282828] text-white shadow-md relative">
        <!-- ✅ 电脑端：完全保留你原来的结构/样式 -->
        <div class="w-full h-[52px] flex justify-between items-center px-10">
            <a href="index.html" class="text-xl font-bold tracking-tighter italic hover:opacity-90 transition">
                Plane<span class="text-blue-500">Pictures</span>
            </a>
        
            <div class="flex items-center space-x-10">
                <!-- 电脑端菜单：保持原样（md及以上显示） -->
                <div class="space-x-8 text-xs uppercase tracking-widest font-bold hidden md:flex">
                    <a href="index.html" class="text-blue-400">Home</a>
                    <a href="gallery.html" class="text-white hover:text-blue-300 transition">Photos</a>
                    <a href="stats.html" class="text-white hover:text-blue-300 transition">Stats</a>
                </div>
            
                <div class="relative flex items-center">
                    <input type="text" id="nav-search-input"
                           placeholder="Search Reg..."
                           class="bg-white text-black text-[11px] px-3 py-1.5 w-32 md:w-44 rounded-sm focus:outline-none placeholder-gray-400 font-sans">
                    <button onclick="performNavSearch()" class="absolute right-2 text-gray-400 hover:text-blue-500 transition">
                        <i class="fa fa-search text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    
        <!-- ✅ 手机端：另起一行显示菜单（md以下显示） -->
        <div class="md:hidden w-full px-4 pb-3">
            <div class="flex justify-center space-x-8 text-xs uppercase tracking-widest font-bold">
                <a href="index.html" class="text-blue-400">Home</a>
                <a href="gallery.html" class="text-white hover:text-blue-300 transition">Photos</a>
                <a href="stats.html" class="text-white hover:text-blue-300 transition">Stats</a>
            </div>
        </div>
    </nav>

    <div class="relative h-36 w-full bg-cover bg-center border-b border-gray-300" style="background-image: url('https://picsum.photos/seed/3/1920/600');">
        <div class="absolute inset-0 bg-black/40"></div>
        <div class="absolute bottom-8 left-10 flex items-end space-x-6 text-white">
            <img src="https://via.placeholder.com/100" class="w-24 h-24 border-4 border-white/30 rounded-sm shadow-xl">
            <div>
                <h1 class="text-4xl font-bold italic tracking-tighter drop-shadow-md">jxclbx</h1>
                <p class="text-xs opacity-90 mt-1 uppercase tracking-widest font-semibold">Total Photos: <span id="total-count" class="text-blue-400">0</span></p>
            </div>
        </div>
    </div>

    <!-- ✅ 手机：单列；桌面：12列 -->
    <main class="max-w-7xl mx-auto mt-8 grid grid-cols-1 md:grid-cols-12 gap-8 px-4">

        <!-- ✅ 桌面侧栏：手机隐藏（保留原结构） -->
        <aside class="hidden md:block md:col-span-3 space-y-6">
            <div class="jet-card p-6">
                <h3 class="text-[11px] font-black border-b border-gray-100 pb-3 mb-6 text-gray-400 uppercase tracking-widest">Photographer Info</h3>
                <div id="gear-list" class="text-[11px]"></div>
            </div>
        </aside>

        <!-- ✅ 主内容：手机全宽；桌面右侧9列 -->
        <section class="md:col-span-9 space-y-8">

            <!-- 1) Editor’s Picks -->
            <div>
                <h3 class="section-title mb-4">Editor's Picks</h3>

                <!-- ✅ 手机2列，桌面3列 -->
                <div id="pinned-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
            </div>

            <!-- 2) Photographer Info：手机显示（放在 Editor’s Picks 下） -->
            <div class="md:hidden">
                <div class="jet-card p-6">
                    <h3 class="text-[11px] font-black border-b border-gray-100 pb-3 mb-6 text-gray-400 uppercase tracking-widest">Photographer Info</h3>
                    <div id="gear-list-mobile" class="text-[11px]"></div>
                </div>
            </div>

            <!-- 3) 三个数据横排（手机），4) 地图（在下面） -->
            <!-- ✅ 手机：先 stats 再 map；桌面：map 左 stats 右 -->
<div class="flex flex-col md:flex-row gap-4">

    <div class="order-1 md:order-2 w-full md:w-64 md:h-[432px]">
        <div class="grid grid-cols-3 md:flex md:flex-col md:h-full gap-4">
            
            <div class="jet-card p-5 flex flex-col justify-center text-center md:flex-1">
                <div id="count-airlines" class="stat-value text-2xl mb-1">0</div>
                <div class="text-[9px] uppercase text-gray-500 font-bold tracking-widest">Airlines</div>
            </div>

            <div class="jet-card p-5 flex flex-col justify-center text-center md:flex-1">
                <div id="count-airports" class="stat-value text-2xl mb-1">0</div>
                <div class="text-[9px] uppercase text-gray-500 font-bold tracking-widest">Airports</div>
            </div>

            <div class="jet-card p-5 flex flex-col justify-center text-center md:flex-1">
                <div id="count-regs" class="stat-value text-2xl mb-1">0</div>
                <div class="text-[9px] uppercase text-gray-500 font-bold tracking-widest">Registrations</div>
            </div>
        </div>
    </div>

    <div class="order-2 md:order-1 jet-card flex-1">
        <div class="p-2 bg-gray-50 text-[9px] font-bold uppercase tracking-widest border-b border-gray-100 italic">Airport Footprints Map</div>
        <div id="map" class="h-[320px] md:h-[402px] w-full"></div>
    </div>

</div>

            <!-- 5) 两张图表：手机纵向；桌面两列 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="jet-card h-64 p-4" id="chart-growth"></div>
                <div class="jet-card h-64 p-4" id="chart-airline"></div>
            </div>

        </section>
    </main>

    <div class="max-w-7xl mx-auto px-4 mt-16 space-y-16">
        <section>
            <h3 class="section-title mb-6">Featured Photos</h3>
            <div id="featured-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>

        <section>
            <h3 class="section-title mb-6" style="border-left-color: #10b981;">Random Discovery</h3>
            <div id="random-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>

        <section>
            <div class="flex justify-between items-end mb-6">
                <h3 class="section-title">Latest Uploads</h3>
                <a href="gallery.html" class="text-[10px] font-bold text-blue-600 hover:text-blue-800 transition">VIEW FULL DATABASE →</a>
            </div>
            <div id="latest-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            <div id="latest-sentinel" class="h-8"></div>
            <div id="latest-loading" class="text-center text-[10px] uppercase tracking-widest font-bold text-gray-500 py-4 hidden">Loading more...</div>
        </section>
    </div>

    <script src="config.js"></script>
    <script src="home.js"></script>

    <script>
        // ✅ 为了“不改 home.js”，这里用一行小桥接：把 gear-list 内容同步到手机版容器
        // 如果你 home.js 本来就是往 #gear-list 填内容，这样手机也能显示同样的内容。
        // 如果你不想加这段，也可以直接把 gear-list-mobile 的 id 改回 gear-list，但那会影响桌面侧栏。
        const syncGear = () => {
            const desktop = document.getElementById('gear-list');
            const mobile = document.getElementById('gear-list-mobile');
            if (desktop && mobile && mobile.innerHTML.trim() === '') {
                mobile.innerHTML = desktop.innerHTML;
            }
        };
        // DOM加载后同步一次，后面 home.js 异步填充的话，稍后再同步几次兜底
        window.addEventListener('load', () => {
            syncGear();
            setTimeout(syncGear, 300);
            setTimeout(syncGear, 800);
        });
    </script>
</body>
</html>
